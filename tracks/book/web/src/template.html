<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description$">
  <title>$title$ - ORBIT Philosophy</title>
  $for(css)$<link rel="stylesheet" href="$css$">$endfor$
</head>
<body>
  <div class="reading-progress" aria-hidden="true"><span id="reading-progress-bar"></span></div>

  <header class="cover" aria-labelledby="book-title">
    <img class="cover-art" src="../../assets/cover-art-v0.1.png" alt="서로 다른 두 궤도가 주황색 중심을 통과해 정렬되는 추상 이미지">
    <div class="cover-shade"></div>
    <div class="cover-copy">
      <p class="eyebrow">ORBIT PHILOSOPHY</p>
      <h1 id="book-title">$title$</h1>
      <p class="subtitle">$subtitle$</p>
      <p class="edition">WEB PROTOTYPE · v0.1</p>
    </div>
    <a class="start-reading" href="#이-판본에-대하여">읽기 시작</a>
  </header>

  <div class="book-layout">
    <aside class="toc-panel" aria-label="책 목차">
      <div class="toc-inner">
        <p class="toc-label">CONTENTS</p>
        <nav id="TOC" aria-label="제1장 세부 목차">
          $table-of-contents$
        </nav>
      </div>
    </aside>

    <main id="main-content" class="book-content">
      <div class="prototype-note">
        <span>v0.1</span>
        <p>전체 3부 10장 설계와 제1장만 담은 읽기 경험 검증용 시제품입니다.</p>
      </div>
      $body$
      <footer class="book-footer">
        <p>첫 답은 끝이 아니다. 첫 결과 뒤의 더 정확한 대화가 본 작업이다.</p>
        <span>ORBIT Philosophy · 2026</span>
      </footer>
    </main>
  </div>

  <button class="to-top" id="to-top" type="button" aria-label="맨 위로 이동">↑</button>
  <script>
    const progressBar = document.getElementById('reading-progress-bar');
    const toTop = document.getElementById('to-top');
    const updateReadingState = () => {
      const height = document.documentElement.scrollHeight - window.innerHeight;
      const ratio = height > 0 ? window.scrollY / height : 0;
      progressBar.style.transform = 'scaleX(' + Math.min(1, Math.max(0, ratio)) + ')';
      toTop.classList.toggle('visible', window.scrollY > window.innerHeight * 0.8);
    };
    window.addEventListener('scroll', updateReadingState, { passive: true });
    toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    updateReadingState();
  </script>
</body>
</html>
