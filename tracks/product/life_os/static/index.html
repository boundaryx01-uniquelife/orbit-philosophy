<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Life OS · 첫 대화</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="brand">ORBIT <span>Life OS</span></div>
    <p>합성 사례로 살펴보는 첫 대화 · 로그인 없음</p>
  </header>
  <main class="layout">
    <aside class="history">
      <details id="history-drawer" open>
        <summary>이전 이야기</summary>
        <button id="new-chat" type="button">새 대화</button>
        <div id="case-list"></div>
      </details>
    </aside>
    <section class="chat" aria-label="Life OS 대화">
      <div id="thread" class="thread" role="log" aria-live="polite"></div>
      <div class="examples" aria-label="합성 예시">
        <span>합성 예시</span>
        <button type="button" data-scenario="question_without_measurement">자료 없이 질문하기</button>
        <button type="button" data-scenario="measurements_with_incomplete_activity_log">두 시점 자료 살펴보기</button>
      </div>
      <form id="composer" class="composer">
        <label for="message">궁금한 점이나 이어서 들려줄 이야기</label>
        <div class="compose-row">
          <textarea id="message" name="message" rows="2" maxlength="2000" placeholder="예: 퇴근하면 저녁을 챙길 여유가 없어요. 무엇부터 살펴볼까요?" required></textarea>
          <button type="submit">보내기</button>
        </div>
      </form>
      <p class="boundary">이 화면은 합성 사례를 위한 대화 시제품입니다. 입력은 이 탭의 메모리에만 머물고 새로고침하면 사라집니다. 실제 건강 자료는 입력하지 마세요.</p>
    </section>
  </main>
</body>
</html>
