<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>함께 알아 가는 대화 · 2단계</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#182b25;background:#f5f7f3}*{box-sizing:border-box}body{margin:0}button,textarea,select,input{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #8baea0;outline-offset:2px}
    .app{min-height:100dvh;display:grid;grid-template-columns:240px minmax(0,1fr) 300px;max-width:1600px;margin:auto}.sidebar,.context{background:#fbfcf9}.sidebar{border-right:1px solid #dbe5dd;padding:23px 15px}.context{border-left:1px solid #dbe5dd;padding:24px 18px;overflow:auto}.brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:850;letter-spacing:-.05em}.mark{display:grid;place-items:center;width:29px;height:29px;border-radius:10px;color:#fff;background:#27654c;font-size:17px}.side-title{font-size:11px;letter-spacing:.08em;color:#708277;font-weight:800;margin:31px 9px 12px}.thread-list{display:grid;gap:4px}.thread-button{border:0;border-radius:10px;background:transparent;text-align:left;width:100%;padding:11px;color:#344b3d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.thread-button:hover,.thread-button.active{background:#e7f0e8;color:#16452f}.new-button{width:100%;border:1px solid #bed1c2;background:#fff;border-radius:11px;padding:11px 12px;color:#205840;font-weight:750;text-align:left;margin-top:24px}.side-foot{font-size:11px;color:#718075;line-height:1.5;margin:24px 9px}
    .chat-column{min-width:0;display:flex;flex-direction:column;height:100dvh;background:#fff}.topbar{height:65px;flex:none;border-bottom:1px solid #e4e9e3;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 24px}.top-title{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:800}.top-actions{display:flex;align-items:center;gap:8px}.mini{font-size:11px;color:#42705a;background:#eaf4eb;border-radius:999px;padding:6px 9px;white-space:nowrap}.icon-button{border:0;background:transparent;border-radius:9px;padding:7px;color:#285741;font-size:20px}.menu-button,.context-button{display:none}.chat-scroll{flex:1;overflow:auto;scrollbar-gutter:stable;padding:26px max(24px,calc((100% - 760px)/2)) 34px}.welcome{padding:clamp(24px,8vh,92px) 0 24px}.welcome .small{color:#448366;font-size:13px;font-weight:800}.welcome h1{font-size:clamp(27px,4vw,39px);line-height:1.25;letter-spacing:-.055em;margin:12px 0}.welcome p{color:#5d7165;line-height:1.6;font-size:15px;max-width:500px}.examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:25px}.example{border:1px solid #d3dfd4;border-radius:12px;background:#fbfdf9;color:#335a42;padding:10px 13px;font-size:13px;text-align:left}.example:hover{background:#edf5ed}
    .turn{margin-bottom:24px;line-height:1.64;overflow-wrap:anywhere}.turn .who{font-size:11px;font-weight:800;color:#64776a;margin-bottom:6px}.turn p{margin:0;white-space:pre-wrap}.turn.user{margin-left:auto;max-width:85%;width:max-content;background:#ecf4ec;border-radius:16px 16px 4px 16px;padding:12px 15px}.turn.user .who{color:#47725b}.turn.assistant{max-width:730px;border-left:3px solid #76a489;padding-left:16px}.turn.assistant p{font-size:15px}.memory-prompt{border:1px solid #cadfcf;background:#f5faf4;border-radius:13px;padding:13px;margin:8px 0 24px}.memory-prompt strong{font-size:12px;color:#356248}.memory-prompt input{margin:8px 0;width:100%;padding:9px;border:1px solid #c0d0c2;border-radius:8px;background:#fff}.memory-prompt .row{display:flex;flex-wrap:wrap;gap:7px}.memory-prompt select{padding:8px;border:1px solid #c0d0c2;border-radius:8px;background:#fff;max-width:100%;font-size:12px}.small-button{border:1px solid #bcd0c0;border-radius:8px;background:#fff;color:#275b40;padding:7px 10px;font-size:12px;font-weight:750}.small-button.primary{background:#256a4b;color:#fff;border-color:#256a4b}.pending{color:#6a7e70;font-size:13px}
    .composer-area{flex:none;padding:14px max(18px,calc((100% - 770px)/2)) 19px;border-top:1px solid #e9ede8;background:#fff}.notice{font-size:12px;color:#8c572e;background:#fff4e7;border:1px solid #ecd8bd;border-radius:9px;padding:8px 11px;margin-bottom:10px}.composer{border:1px solid #b9cbbb;box-shadow:0 3px 15px #1a50310d;border-radius:17px;padding:11px 12px;background:#fff}.composer textarea{width:100%;border:0;resize:none;min-height:44px;max-height:160px;outline:none;color:#20362a;font-size:15px}.composer-bar{display:flex;justify-content:space-between;align-items:center;gap:10px}.hint{font-size:11px;color:#7e8d80}.send{border:0;background:#1d6648;color:#fff;border-radius:10px;padding:9px 16px;font-weight:800}.send:disabled{opacity:.45;cursor:not-allowed}.error{color:#a13b3b;font-size:12px;min-height:18px;margin:8px 3px 0}
    .context h2{font-size:16px;margin:0 0 20px;letter-spacing:-.04em}.context section{padding:17px 0;border-top:1px solid #e1e9e0}.context h3{font-size:13px;margin:0 0 10px}.context p,.context li{font-size:12px;line-height:1.6;color:#5d7164}.context select{border:1px solid #c1d1c2;border-radius:9px;background:white;padding:9px;width:100%;color:#294c38}.context-list{margin:0;padding-left:18px}.context-list li{margin-bottom:8px;overflow-wrap:anywhere}.context details{font-size:12px}.context summary{cursor:pointer;font-weight:800;color:#31583e}.context .field{margin:13px 0}.context label{display:block;font-size:11px;font-weight:800;margin-bottom:5px;color:#5d6c5e}.context textarea{width:100%;min-height:68px;resize:vertical;border:1px solid #c1d1c2;border-radius:9px;padding:8px}.context .field select{padding:8px}.context .red{color:#9f4b46;border-color:#ddc3c0;margin-top:16px}
    .mobile-context{display:none}.veil{display:none}
    @media(max-width:1120px){.app{grid-template-columns:200px minmax(0,1fr)}.context{display:none}.context-button{display:block}.mobile-context{display:block}.mobile-context[hidden]{display:none}.mobile-context{position:absolute;z-index:5;right:12px;top:72px;width:min(330px,calc(100vw - 24px));max-height:calc(100dvh - 86px);overflow:auto;border:1px solid #d9e5d9;border-radius:16px;background:#fbfcf9;box-shadow:0 16px 48px #1d39252b;padding:18px}.mobile-context .context{display:block;border:0;padding:0}}
    @media(max-width:700px){.app{display:block}.sidebar{position:fixed;z-index:11;left:0;top:0;bottom:0;width:min(285px,85vw);transform:translateX(-105%);transition:transform .18s;box-shadow:8px 0 30px #112a1a22}.sidebar.open{transform:none}.veil.open{display:block;position:fixed;inset:0;background:#091d1280;z-index:10}.chat-column{height:100dvh}.topbar{height:58px;padding:0 14px}.top-title{font-size:13px}.menu-button{display:block}.chat-scroll{padding:21px 17px 22px}.welcome{padding:clamp(18px,6vh,55px) 0 20px}.welcome p{font-size:14px}.examples{display:grid}.example{width:100%}.composer-area{padding:10px 12px 12px}.turn.user{max-width:91%}.turn.assistant p{font-size:14px}}
  </style>
</head>
<body>
<div class="app">
  <div id="veil" class="veil"></div>
  <nav class="sidebar" id="sidebar" aria-label="대화 목록">
    <div class="brand"><span class="mark">◌</span> 함께 알아 가는 대화</div>
    <button id="new-thread" class="new-button" type="button">＋ 새 대화</button>
    <div class="side-title">최근 대화</div><div id="thread-list" class="thread-list"></div>
    <div class="side-foot">분야를 나눠 쓰던 지침을 한곳에서 활용합니다. 대화에서 확인한 조건은 범위를 정해 기억합니다.</div>
  </nav>
  <div class="chat-column">
    <header class="topbar"><div class="top-actions"><button id="menu-button" class="icon-button menu-button" type="button" aria-label="대화 목록 열기">☰</button><div class="top-title" id="top-title">새 대화</div></div><div class="top-actions"><span class="mini" id="domain-badge">분야 자동 선택</span><button id="context-button" class="icon-button context-button" type="button" aria-label="현재 맥락 보기">☷</button></div></header>
    <main class="chat-scroll" id="chat-scroll" aria-live="polite">
      <div class="welcome" id="welcome"><div class="small">대화하며 서로 알아 가는 공간</div><h1>무슨 이야기부터 할까요?</h1><p>지금 고르는 물건이나 요즘 관심 있는 일부터 말해 주세요. 대화에서 확인한 내용을 기억하고, 먼저 말을 걸어도 되는지는 직접 정할 수 있습니다.</p><div class="examples"><button type="button" class="example" data-example="새로 산 손목 기기의 화면을 보호할 제품을 찾고 있어요.">손목 기기의 화면 보호 제품을 찾고 있어요</button><button type="button" class="example" data-example="요즘 내 생활에 맞는 물건을 고르기 어려워요.">요즘 물건을 고르기 어려워요</button></div><button type="button" id="open-channel" class="small-button" style="margin-top:18px">먼저 말을 걸 수 있게 설정하기 ↗</button></div>
      <div id="turns"></div><div id="memory-prompts"></div>
    </main>
    <div class="composer-area"><div id="model-notice" class="notice" hidden>AI 연결 설정 전입니다. 현재는 화면과 저장 흐름만 확인할 수 있습니다.</div><form id="composer" class="composer"><textarea id="message" maxlength="2000" rows="2" placeholder="질문하거나 상품 링크를 붙여넣으세요" aria-label="메시지"></textarea><div class="composer-bar"><span class="hint">정보가 부족하면 필요한 것 하나를 묻습니다</span><button id="send" class="send" type="submit">보내기</button></div></form><div class="error" id="error" role="alert"></div></div>
  </div>
  <aside class="context" id="desktop-context" aria-label="현재 맥락"></aside>
  <div class="mobile-context" id="mobile-context" hidden><div class="context" id="mobile-context-body"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);let activeId=null,active=null,threads=[],modelReady=false,domainChoice='',telegramReady=false,telegramLinked=false,outreachEnabled=false,telegramBotName='',linkCode='';
const labels={conversation:'일반 대화',shopping:'쇼핑',office:'사무용품',daily:'먹거리·일상',electronics:'전자제품',vehicle:'차량'};
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
async function api(path,method='GET',body){const response=await fetch(path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});const data=await response.json();if(!response.ok)throw Error(data.error||'요청을 처리하지 못했습니다.');return data}
function error(message=''){$('error').textContent=message}
function closeMenu(){$('sidebar').classList.remove('open');$('veil').classList.remove('open')}
async function bootstrap(){const data=await api('/api/bootstrap');threads=data.threads;modelReady=data.model_ready;telegramReady=data.telegram_ready;telegramLinked=data.telegram_linked;outreachEnabled=data.outreach_enabled;telegramBotName=data.telegram_bot_name;$('model-notice').hidden=modelReady;$('send').disabled=!modelReady;renderList();if(activeId){if(!threads.some(t=>t.id===activeId))return showNew();return openThread(activeId)}if(threads.length)return openThread(threads[0].id);showNew()}
function renderList(){const list=$('thread-list');list.replaceChildren(...threads.map(thread=>{const b=el('button','thread-button'+(thread.id===activeId?' active':''),thread.title);b.type='button';b.onclick=()=>openThread(thread.id);return b}))}
function showNew(){activeId=null;active=null;domainChoice='';$('top-title').textContent='새 대화';$('domain-badge').textContent='분야 자동 선택';$('welcome').hidden=false;$('turns').replaceChildren();$('memory-prompts').replaceChildren();renderContext();renderList();closeMenu();error();$('message').focus()}
async function openThread(id){try{const data=await api('/api/threads/'+encodeURIComponent(id));activeId=id;active=data;domainChoice=data.domain;renderThread();renderList();closeMenu();error()}catch(e){error(e.message)}}
function renderThread(){if(!active)return showNew();$('welcome').hidden=true;$('top-title').textContent=active.title;$('domain-badge').textContent=labels[active.domain]||'쇼핑';const turns=$('turns');turns.replaceChildren(...active.turns.map(turn=>{const box=el('article','turn '+turn.role),who=el('div','who',turn.role==='user'?'나':'함께 고르는 봇');box.append(who,el('p','',turn.body));return box}));const prompts=$('memory-prompts');prompts.replaceChildren(...active.memories.filter(m=>m.status==='proposed').map(memoryCard));renderContext();requestAnimationFrame(()=>$('chat-scroll').scrollTop=$('chat-scroll').scrollHeight)}
function memoryCard(memory){const box=el('div','memory-prompt'),title=el('strong','', '다음 판단에도 이 내용을 참고할까요?'),input=el('input');input.value=memory.text;input.maxLength=300;input.setAttribute('aria-label','기억할 내용');const row=el('div','row'),select=el('select');for(const [key,value] of [['thread','이 대화만'],['domain','같은 분야'],['global','모든 분야']]){const option=el('option','',value);option.value=key;select.append(option)}select.value=memory.scope;const accept=el('button','small-button primary','기억하기'),skip=el('button','small-button','이번엔 건너뛰기');accept.type=skip.type='button';accept.onclick=()=>updateMemory(memory.id,{status:'confirmed',text:input.value,scope:select.value});skip.onclick=()=>updateMemory(memory.id,{status:'rejected'});row.append(select,accept,skip);box.append(title,input,row);return box}
async function updateMemory(id,body){try{active=await api('/api/memories/'+encodeURIComponent(id),'PUT',body);renderThread();error()}catch(e){error(e.message)}}
function renderContext(){for(const target of [$('desktop-context'),$('mobile-context-body')]){target.replaceChildren();target.append(el('h2','','현재 맥락'));const area=el('section');area.append(el('h3','','적용 분야'));const select=el('select');select.setAttribute('aria-label','적용 분야');for(const [key,value] of [['','자동 선택'],...Object.entries(labels)]){const option=el('option','',value);option.value=key;select.append(option)}select.value=domainChoice;select.onchange=()=>{domainChoice=select.value;renderContext()};area.append(select,el('p','','다음 답변부터 적용됩니다. 잘못 고른 분야라면 바꿔 주세요.'));target.append(area);
    const channel=el('section');channel.append(el('h3','','먼저 대화하기'));if(!telegramReady)channel.append(el('p','','Telegram 봇이 설정되면 연결할 수 있습니다.'));else if(!telegramLinked){channel.append(el('p','','웹과 Telegram에서 같은 대화를 이어갑니다. 연결 후 먼저 메시지를 보낼지는 따로 선택합니다.'));const button=el('button','small-button','연결 코드 만들기');button.type='button';button.onclick=createLinkCode;channel.append(button);if(linkCode){const code=el('p','','Telegram '+(telegramBotName?'@'+telegramBotName+'에 ':'봇에 ')+'/start '+linkCode+' 를 보내세요. 코드는 10분 동안 한 번만 쓸 수 있습니다.');channel.append(code)}}else{const status=el('p','','Telegram 연결됨 · 먼저 메시지 '+(outreachEnabled?'켜짐':'꺼짐'));channel.append(status);const toggle=el('button','small-button',outreachEnabled?'먼저 말 걸기 끄기':'먼저 말 걸기 켜기');toggle.type='button';toggle.onclick=toggleOutreach;const unlink=el('button','small-button','연결 끊기');unlink.type='button';unlink.onclick=unlinkTelegram;channel.append(toggle,' ',unlink)}target.append(channel);
    if(!active){const empty=el('section');empty.append(el('h3','','기억과 근거'),el('p','','대화를 시작하면 확인한 조건과 제공한 자료가 여기에 나타납니다.'));target.append(empty);continue}
    const mem=el('section');mem.append(el('h3','','확인한 기억'));const confirmed=active.memories.filter(m=>m.status==='confirmed');if(!confirmed.length)mem.append(el('p','','아직 다른 판단에 쓰기로 확인한 내용이 없습니다.'));else{const ul=el('ul','context-list');for(const item of confirmed){const li=el('li','',item.text+' · '+({thread:'이 대화',domain:'같은 분야',global:'모든 분야'}[item.scope]));if(item.thread_id===active.id){const edit=el('button','small-button','수정'),del=el('button','small-button','삭제');edit.type=del.type='button';edit.onclick=()=>editMemory(item);del.onclick=()=>removeMemory(item.id);li.append(' ',edit,' ',del)}ul.append(li)}mem.append(ul)}target.append(mem);
    const sources=el('section');sources.append(el('h3','','링크와 검색 출처'));if(!active.evidence.length)sources.append(el('p','','아직 없습니다.'));else{const ul=el('ul','context-list');for(const source of active.evidence){const li=el('li'),a=el('a','','원문 열기');a.href=source.url;a.target='_blank';a.rel='noopener noreferrer';li.append(a,source.verification==='search_snippet_unverified'?' · 검색 요약만 확인, 원문·가격 미확인':' · 제공한 주소, 본문·가격 미확인');ul.append(li)}sources.append(ul)}target.append(sources);
    if(active.outreach_decisions&&active.outreach_decisions.length){const why=el('section');why.append(el('h3','','먼저 물은 이유'));for(const decision of active.outreach_decisions.filter(item=>item.sent))why.append(el('p','',decision.reason));target.append(why)}
    const feedback=el('section'),details=el('details'),summary=el('summary','','나중에 선택·사용 결과 남기기');details.append(summary);const form=el('form');form.className='feedback-form';const reaction=fieldSelect('제안에 대한 반응',[['','선택하지 않음'],['helpful','도움이 됨'],['consider','고려해 볼게'],['not_fit','지금은 맞지 않음']],active.feedback.reaction),purchased=fieldSelect('실제 구매',[['unknown','아직 모름'],['yes','구매함'],['no','구매하지 않음']],active.feedback.purchased);const result=el('div','field'),label=el('label','','사용 뒤 체감'),textarea=el('textarea');textarea.value=active.feedback.outcome;textarea.maxLength=500;result.append(label,textarea);const save=el('button','small-button primary','저장');save.type='submit';form.append(reaction.wrapper,purchased.wrapper,result,save);form.onsubmit=async event=>{event.preventDefault();try{active=await api('/api/feedback/'+encodeURIComponent(activeId),'PUT',{reaction:reaction.select.value,purchased:purchased.select.value,outcome:textarea.value});renderContext();error()}catch(e){error(e.message)}};details.append(form);feedback.append(details);target.append(feedback);
    const controls=el('section'),remove=el('button','small-button red','이 대화 삭제');remove.type='button';remove.onclick=deleteThread;controls.append(remove);target.append(controls);
  }}
function fieldSelect(title,values,current){const wrapper=el('div','field'),label=el('label','',title),select=el('select');for(const [key,value] of values){const option=el('option','',value);option.value=key;select.append(option)}select.value=current;wrapper.append(label,select);return {wrapper,select}}
async function removeMemory(id){if(!confirm('이 기억을 삭제할까요?'))return;try{active=await api('/api/memories/'+encodeURIComponent(id),'DELETE',{});renderThread()}catch(e){error(e.message)}}
async function editMemory(item){const text=prompt('기억할 내용을 수정해 주세요.',item.text);if(text===null||text.trim()===item.text)return;try{active=await api('/api/memories/'+encodeURIComponent(item.id),'PUT',{status:'confirmed',text:text.trim(),scope:item.scope});renderThread();error()}catch(e){error(e.message)}}
async function createLinkCode(){try{const data=await api('/api/telegram/link-code','POST',{});linkCode=data.code;renderContext();error()}catch(e){error(e.message)}}
async function toggleOutreach(){try{const data=await api('/api/outreach','PUT',{enabled:!outreachEnabled});outreachEnabled=data.outreach_enabled;renderContext();error()}catch(e){error(e.message)}}
async function unlinkTelegram(){if(!confirm('Telegram 연결과 먼저 말 걸기를 끌까요?'))return;try{await api('/api/telegram/unlink','POST',{});telegramLinked=false;outreachEnabled=false;renderContext();error()}catch(e){error(e.message)}}
async function deleteThread(){if(!activeId||!confirm('이 대화와 연결된 자료·기억을 삭제할까요?'))return;try{await api('/api/threads/'+encodeURIComponent(activeId),'DELETE',{});activeId=null;await bootstrap()}catch(e){error(e.message)}}
$('composer').onsubmit=async event=>{event.preventDefault();const message=$('message').value.trim();if(!message)return;error();$('send').disabled=true;try{active=await api('/api/chat','POST',{thread_id:activeId,message,domain:domainChoice||undefined});const searchFailed=active.search_status==='failed';activeId=active.id;$('message').value='';await bootstrap();renderThread();if(searchFailed)error('검색 연결에 실패했습니다. 최신 정보는 확인되지 않았습니다.')}catch(e){error(e.message)}finally{$('send').disabled=!modelReady}};
$('message').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();$('composer').requestSubmit()}});
$('new-thread').onclick=showNew;$('menu-button').onclick=() => {$('sidebar').classList.add('open');$('veil').classList.add('open')};$('veil').onclick=closeMenu;$('context-button').onclick=()=>{$('mobile-context').hidden=!$('mobile-context').hidden};document.querySelectorAll('[data-example]').forEach(button=>button.onclick=()=>{$('message').value=button.dataset.example;$('message').focus()});
$('open-channel').onclick=()=>{if(innerWidth>1120){$('desktop-context').scrollIntoView({behavior:'smooth'});return}$('mobile-context').hidden=false};
bootstrap().catch(e=>error(e.message));
setInterval(async()=>{if(document.visibilityState!=='visible')return;try{const data=await api('/api/bootstrap');threads=data.threads;telegramLinked=data.telegram_linked;outreachEnabled=data.outreach_enabled;renderList();if(activeId){const updated=await api('/api/threads/'+encodeURIComponent(activeId));if(!active||updated.revision!==active.revision){active=updated;renderThread()}}else if(threads.length){await openThread(threads[0].id)}else renderContext()}catch{}},15000);
</script>
</body>
</html>
